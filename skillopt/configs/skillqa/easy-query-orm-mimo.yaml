_base_: ./default.yaml

model:
  backend: qwen_chat
  optimizer: mimo-v2.5-pro
  target: mimo-v2.5-pro
  optimizer_backend: qwen_chat
  target_backend: qwen_chat
  qwen_chat_base_url: https://api.xiaomimimo.com/v1
  qwen_chat_api_key: ""
  qwen_chat_timeout_seconds: 300
  qwen_chat_max_tokens: 16000
  qwen_chat_enable_thinking: false

train:
  num_epochs: 3
  batch_size: 16
  accumulation: 1

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 6

optimizer:
  learning_rate: 4
  lr_scheduler: cosine
  use_slow_update: true
  use_meta_skill: true

evaluation:
  use_gate: true
  eval_test: true

env:
  name: skillqa
  skill_init: D:/skill/easy-query-orm/SKILL.md
  split_mode: split_dir
  split_dir: data/skillqa_split
  workers: 6
  max_completion_tokens: 12000
  limit: 0
